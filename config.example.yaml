# OneButton configuration. Copy to local/config.yaml and edit.
# Nothing in this file is secret, but local/config.yaml is still git-ignored.

language: es                 # Whisper language code: es, en, ...
button_key: space            # Button 1, the stronger hand: talk. Key the USB switch sends; "space" is the usual one.
button2_key: enter           # Button 2, optional: no / cancel. Set to null for a single-button setup.
button_source: auto          # auto, global (system-wide capture), terminal (terminal must stay focused)
silence_timeout: 90          # Seconds of silence before a recording stops on its own.
max_recording: 600           # Hard cap in seconds for a single utterance.
sample_rate: 16000
input_device: null           # Microphone name or index for sounddevice; null = system default.
silence_rms: auto            # auto calibrates from room noise at startup; or a number such as 0.01.
whisper_model: small         # tiny, base, small, medium, large-v3. "small" is fine for Spanish on a CPU.
whisper_device: auto         # auto, cpu, cuda

# Voice words. Two syllables are recognised far more reliably than "sí" alone.
confirm_words: ["adelante", "sí adelante", "confirmo"]
cancel_words: ["cancela", "cancelar", "no", "para"]
update_words: ["actualiza", "actualizar"]
undo_words: ["deshacer", "deshaz"]
repeat_words: ["repite", "repítelo"]

# Speech output.
tts: auto                    # auto, say (macOS), espeak, pyttsx3, none
tts_voice: ""                # Leave empty for the system default. On macOS try "Paulina" or "Jorge".
tts_rate: 170
piper_model: ""              # Path to a Piper .onnx voice (good offline Spanish on Linux). Used when tts is piper or auto.
progress_interval: 45        # Seconds before saying "sigo en ello" during a long task. 0 disables.
log_transcripts: true        # Append what was said and answered to local/session.log (never leaves the machine).

# Screen.
font_size: 28                # Terminal font size the helper sets. Informational, used by the install guide.

# Claude Code.
claude_bin: claude
permission_mode: acceptEdits # acceptEdits is safe: tools outside the allow list are denied, not prompted.
claude_timeout: 600          # Seconds before a single turn is abandoned and reported aloud.
max_turns: 30

# Modules. Each adds rules and, sometimes, a helper that starts with the loop.
modules: []                  # e.g. [maths-screen]

# Updates. The updater refuses anything that is not a tag signed by a key in local/allowed_signers.
repo_url: https://github.com/MarcoArmenta/OneButton.git
